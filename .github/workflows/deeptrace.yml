name: DeepTrace CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  deeptrace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Node tests
        if: hashFiles('package.json') != ''
        shell: bash
        run: npm test

      - name: Setup Python
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        shell: bash
        run: pip install -r requirements.txt

      - name: Run Python tests
        if: hashFiles('requirements.txt') != ''
        shell: bash
        run: pytest

      - name: Unsupported project
        if: hashFiles('package.json', 'requirements.txt') == ''
        shell: bash
        run: |
          echo "DeepTrace could not identify a supported project test entry point."
          echo "Add package.json or requirements.txt, then push again."
          exit 1
